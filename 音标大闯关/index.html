<script src="assets/vendor/ScrollTrigger.min.js?v=hud-20261108"></script>
<script src="assets/vendor/lenis.min.js?v=hud-20261108"></script>
<script>
  /* 仅当动画库加载成功且用户未要求减少动效时，才启用“入场前隐藏”的初始态；
     否则内容保持默认可见，确保任何情况下都不会白屏。 */
  (function () {
    var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (window.gsap && window.ScrollTrigger && !rm) {
      document.documentElement.classList.add("gsap-ready");
    }
  })();
</script>
</head>
